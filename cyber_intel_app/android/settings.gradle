// Modern Flutter Gradle setup (declarative plugins block).
//
// The previous version used:
//     apply from: "$flutterSdkPath/packages/flutter_tools/gradle/app_plugin_loader.gradle"
// That script was REMOVED from the Flutter SDK in 3.29. Because CI installs the
// latest stable channel, the file no longer existed and the build failed before
// it ever reached compileSdk or plugin resolution — which is why tuning those
// never helped.

pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

include ":app"

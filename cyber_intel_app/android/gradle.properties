android.useAndroidX=true

# enableJetifier was removed. It rewrites legacy support-library bytecode, which
# nothing here uses, and AGP 8 warns or fails on it. It also slowed every build.

# CI runners default to a small heap and the Kotlin + AGP toolchain will OOM
# partway through an APK build without this.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError

org.gradle.parallel=true
org.gradle.caching=true

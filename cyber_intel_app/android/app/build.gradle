// Plugin IDs are declared in settings.gradle. The Flutter plugin MUST be
// applied after the Android and Kotlin plugins.
plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.quantx.cyber_intel_app"

    // Track the Flutter SDK that CI installs instead of pinning numbers by
    // hand. A hard-coded compileSdk is what kept drifting out of sync with the
    // plugins (device_info_plus, network_info_plus, permission_handler), since
    // their `^` version ranges resolve to whatever is current at build time.
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    defaultConfig {
        applicationId = "com.quantx.cyber_intel_app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Debug-signed so `flutter build apk --release` yields an
            // installable APK in CI with no keystore. Swap in a real
            // signingConfig before any Play Store submission.
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // kotlin-stdlib is supplied by the Kotlin plugin; declaring it by hand
    // risks a version clash with the plugin's own.
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "androidx.core:core-ktx:1.13.1"
}

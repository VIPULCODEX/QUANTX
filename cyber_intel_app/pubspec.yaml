name: cyber_intel_app
description: "QuantX AI Cybersecurity Intelligence Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  provider: ^6.0.5
  google_fonts: ^6.1.0
  intl: ^0.18.1
  flutter_spinkit: ^5.2.0
  shared_preferences: ^2.2.2
  # Security Dashboard plugins
  network_info_plus: ^6.0.0       # Wi-Fi SSID and network info (compileSdk 34 compatible)
  device_info_plus: ^11.1.1       # Android version and device details (compileSdk 34 compatible)
  permission_handler: ^11.3.1     # Request runtime permissions cleanly

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
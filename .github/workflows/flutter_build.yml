name: Build Flutter APK

on:
  push:
    paths:
      - 'cyber_intel_app/**'
      - '.github/workflows/flutter_build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        working-directory: ./cyber_intel_app
        run: flutter pub get

      - name: Regenerate Android folder
        working-directory: ./cyber_intel_app
        run: |
          # Remove android folder and let Flutter regenerate it cleanly
          # This produces correct build.gradle.kts, settings.gradle.kts, gradlew etc.
          rm -rf android
          # Pipe 'yes' to bypass any interactive confirmation prompts
          yes | flutter create . --platforms android --org com.quantx || true
          # Ensure the android directory was created
          ls android/gradlew || { echo "ERROR: gradlew not generated"; exit 1; }

          # Write SDK paths into local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

          # Replace the generated AndroidManifest with our custom one
          cp android_src/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android_src/strings.xml android/app/src/main/res/values/strings.xml

          echo "=== AndroidManifest ==="
          cat android/app/src/main/AndroidManifest.xml

          # Force all Flutter plugins to compile against SDK 36
          # This prevents "plugin compiled against android-33" errors
          ROOT_GRADLE="android/build.gradle"
          if [ -f "$ROOT_GRADLE" ]; then
            cat >> "$ROOT_GRADLE" << 'GRADLE_EOF'

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android.compileSdkVersion 36
        }
    }
}
GRADLE_EOF
          fi

      - name: Build APK
        working-directory: ./cyber_intel_app
        run: |
          if ! flutter build apk --release > build_log.txt 2>&1; then
            echo "======================================================"
            echo "                   BUILD FAILED"
            echo "======================================================"
            tail -n 80 build_log.txt
            echo "======================================================"
            exit 1
          fi
          echo "BUILD SUCCEEDED"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuantX-Cyber-Intel-App
          path: cyber_intel_app/build/app/outputs/flutter-apk/app-release.apk

name: Build Flutter APK

# NOTE: `branches` must stay listed. If a `tags` filter is present without a
# `branches` filter, GitHub stops running the workflow on branch pushes
# altogether. Releases therefore live in flutter_release.yml, not here.
on:
  push:
    branches:
      - main
    paths:
      - 'cyber_intel_app/**'
      - '.github/workflows/flutter_build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Least privilege: this workflow only builds and uploads an artifact.
    # Release publishing (which needs contents:write) lives in flutter_release.yml.
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        working-directory: ./cyber_intel_app
        run: flutter pub get

      - name: Write local.properties
        working-directory: ./cyber_intel_app
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
          cat android/local.properties

      # Toolchain versions decide which AGP/Gradle/compileSdk combination is
      # valid, and Flutter enforces its own minimums. Printing them makes a
      # version mismatch obvious instead of something to guess at.
      - name: Toolchain versions
        working-directory: ./cyber_intel_app
        run: |
          echo "───────────── flutter ─────────────"
          flutter --version
          echo "───────────── java ───────────────"
          java -version
          echo "───────────── gradle wrapper ─────"
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties
          echo "───────────── android sdk ────────"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms" 2>/dev/null || echo "(no platforms dir)"

      - name: Build APK
        working-directory: ./cyber_intel_app
        run: |
          set -o pipefail
          # NOTE: `flutter build apk` has no --stacktrace flag; passing one
          # fails the command outright with exit 64. Use -v for detail.
          flutter build apk --release 2>&1 | tee build_log.txt

      - name: Build failure diagnostics
        if: failure()
        working-directory: ./cyber_intel_app
        run: |
          echo "=================== FULL BUILD LOG ==================="
          cat build_log.txt || echo "(no build log produced)"
          echo "=================== GRADLE CONFIG ===================="
          for f in android/settings.gradle android/build.gradle \
                   android/app/build.gradle android/gradle.properties \
                   android/local.properties; do
            echo "--------- $f ---------"
            cat "$f" 2>/dev/null || echo "(missing)"
          done

      # Kept even on failure so the full log is downloadable rather than
      # truncated in the web UI.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: cyber_intel_app/build_log.txt
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuantX-Cyber-Intel-App
          path: cyber_intel_app/build/app/outputs/flutter-apk/app-release.apk

name: Build Flutter APK

on:
  push:
    paths:
      - 'cyber_intel_app/**'
      - '.github/workflows/flutter_build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        working-directory: ./cyber_intel_app
        run: flutter pub get

      - name: Write local.properties
        working-directory: ./cyber_intel_app
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
          cat android/local.properties

      - name: Build APK
        working-directory: ./cyber_intel_app
        run: |
          if ! flutter build apk --release > build_log.txt 2>&1; then
            echo "======================================================"
            echo "                   BUILD FAILED"
            echo "======================================================"
            tail -n 100 build_log.txt
            echo "======================================================"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuantX-Cyber-Intel-App
          path: cyber_intel_app/build/app/outputs/flutter-apk/app-release.apk
